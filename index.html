```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Text Summarizer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="icon">📝</div>
            <h1>Text Summarizer</h1>
            <p>Turn long text into a short and meaningful summary</p>
        </div>

        <div class="main-content">

            <!-- Input Section -->

            <div class="input-section">

                <label for="textInput">
                    Enter your text
                </label>

                <textarea
                    id="textInput"
                    placeholder="Paste your paragraph or article here..."
                ></textarea>

                <div class="input-info">
                    <span id="wordCount">0 words</span>
                    <span id="charCount">0 characters</span>
                </div>

                <div class="buttons">

                    <button onclick="summarizeText()">
                        ✨ Summarize
                    </button>

                    <button class="clear-btn" onclick="clearText()">
                        🗑️ Clear
                    </button>

                </div>

            </div>

            <!-- Summary Section -->

            <div class="summary-section">

                <div class="summary-header">
                    <h2>📋 Summary</h2>

                    <span id="summaryInfo">
                        Ready
                    </span>
                </div>

                <div id="summaryBox" class="summary-box">

                    <p class="placeholder">
                        Your summary will appear here...
                    </p>

                </div>

                <div class="summary-stats">

                    <div>
                        <strong id="originalWords">0</strong>
                        <span>Original Words</span>
                    </div>

                    <div>
                        <strong id="summaryWords">0</strong>
                        <span>Summary Words</span>
                    </div>

                    <div>
                        <strong id="reduction">0%</strong>
                        <span>Reduction</span>
                    </div>

                </div>

            </div>

        </div>

        <div class="footer">
            <p>💡 Tip: For better results, enter a paragraph with multiple sentences.</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
```
